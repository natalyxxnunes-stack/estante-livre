name: Baixar capas (temporário)
on:
  push:
    branches: [capas-download]
    paths: ['capas-raw/manifesto.tsv']
permissions:
  contents: write
jobs:
  baixar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar imagens do manifesto
        run: |
          while IFS=$'\t' read -r nome url; do
            [ -z "$nome" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "capas-raw/$nome.jpg" "$url" && echo "ok $nome $(stat -c%s capas-raw/$nome.jpg)" || echo "FALHOU $nome"
          done < capas-raw/manifesto.tsv
      - name: Versionar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capas-raw/*.jpg
          git commit -m "Capas baixadas [skip ci]" && git push || echo "nada novo"
