name: Validate and generate Estante Livre

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate data and regenerate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check scripts/gerar.js
          node --check assets/dados.js
          node --check assets/comum.js
          node --check assets/mundo.js
      - name: Validate catalogue and generate static pages
        run: node scripts/gerar.js
      - name: Commit regenerated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
          else
            git commit -m "Build generated static pages"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              TARGET_BRANCH="${{ github.event.pull_request.head.ref }}"
            else
              TARGET_BRANCH="$GITHUB_REF_NAME"
            fi
            git push origin "HEAD:$TARGET_BRANCH"
          fi
