name: Validate Estante Livre

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate data and generate static pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check scripts/gerar.js
          node --check assets/dados.js
          node --check assets/comum.js
          node --check assets/mundo.js
      - name: Validate catalogue and generate pages
        run: node scripts/gerar.js
