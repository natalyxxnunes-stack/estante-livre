name: Regenerate Estante Livre

on:
  push:
    branches: ['**']
    paths:
      - 'assets/dados.js'
      - 'assets/comum.js'
      - 'scripts/gerar.js'
      - '*.html'
      - 'casos/**'
      - 'livros/**'
      - 'atos/**'
      - '.github/workflows/regenerate-site.yml'
  workflow_dispatch:

concurrency:
  group: regenerate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and regenerate static pages and open data
        run: node scripts/gerar.js
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' casos livros atos dados/estante-livre-casos.csv dados/estante-livre-casos.json sitemap.xml robots.txt llms.txt
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Regenerate Estante Livre static site"
            git push
          fi
